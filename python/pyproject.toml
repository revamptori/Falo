[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "falo"
version = "0.1.0"
description = "Falo - Production-grade Rust game engine with first-class Python support (2D & 3D)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Falo Engine Team", email = "team@falo.engine" }]
keywords = ["game-engine", "2d", "3d", "rendering", "physics", "wgpu"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pillow", "numpy"]
maturin = ["maturin>=1.7"]

[project.urls]
Homepage = "https://github.com/revamptori/Falo"
Repository = "https://github.com/revamptori/Falo"
Documentation = "https://github.com/revamptori/Falo/blob/main/docs/README.md"

[project.scripts]
falo = "falo.cli:main"
engine = "falo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

# Maturin config — NOTE: manifest-path must point to the *crate*, not the workspace
# Workspace Cargo.toml has no [package], so ../Cargo.toml would fail with
# "missing field package" (the error you saw). Use the falo-python crate.
[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "../crates/falo-python/Cargo.toml"
bindings = "pyo3"
module-name = "falo._falo"
python-source = "src"
strip = true

[tool.falo]
default_target = "linux"
profile = "release"
bundle_python = true
compress_assets = true
