[workspace]
members = [
    "crates/falo-core",
    "crates/falo-math",
    "crates/falo-window",
    "crates/falo-gpu",
    "crates/falo-renderer",
    "crates/falo-renderer-2d",
    "crates/falo-renderer-3d",
    "crates/falo-input",
    "crates/falo-ecs",
    "crates/falo-scene",
    "crates/falo-assets",
    "crates/falo-audio",
    "crates/falo-physics",
    "crates/falo-animation",
    "crates/falo-particles",
    "crates/falo-ui",
    "crates/falo-network",
    "crates/falo-serialization",
    "crates/falo-debug",
    "crates/falo-profiler",
    "crates/falo-scripting",
    "crates/falo-python",
    "crates/falo-editor",
    "crates/falo-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/revamptori/Falo"
authors = ["Falo Engine Team"]
rust-version = "1.85"
keywords = ["game-engine", "2d", "3d", "rendering", "physics", "python"]
categories = ["game-engines", "graphics", "multimedia"]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
rmp-serde = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Math
glam = { version = "0.28", features = ["serde"] }

# Windowing / GPU — pinned compatible set: wgpu 0.20 + winit 0.30 + naga 0.20
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = { version = "0.20", features = ["wgsl"] }
naga = { version = "0.20" }
raw-window-handle = "0.6"

# ECS — use default features for scheduler + change detection
bevy_ecs = { version = "0.14" }

# Assets / Images
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "hdr"] }
gltf = { version = "1.4", features = ["import"] }
# Kira audio — cpal backend required; remove default guess, enable cpal explicitly
kira = { version = "0.9", default-features = false, features = ["cpal"] }
cpal = "0.15"

# Physics
rapier2d = { version = "0.23", features = ["simd-stable"] }
rapier3d = { version = "0.23", features = ["simd-stable"] }

# UI / Editor — egui 0.29 matches wgpu 0.20, winit 0.30
egui = { version = "0.29", default-features = false }
egui-wgpu = { version = "0.29" }
egui-winit = { version = "0.29" }

# Networking — quinn 0.11 feature names are `rustls-ring`/`rustls-aws-lc` + runtime
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }

# Python — pyo3 extension-module; numpy is *not* a workspace dep, used only in Python package
pyo3 = { version = "0.22", features = ["extension-module"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Internal crates — hyphen names; Rust code imports as underscore (falo_core)
falo-core = { path = "crates/falo-core" }
falo-math = { path = "crates/falo-math" }
falo-window = { path = "crates/falo-window" }
falo-gpu = { path = "crates/falo-gpu" }
falo-renderer = { path = "crates/falo-renderer" }
falo-renderer-2d = { path = "crates/falo-renderer-2d" }
falo-renderer-3d = { path = "crates/falo-renderer-3d" }
falo-input = { path = "crates/falo-input" }
falo-ecs = { path = "crates/falo-ecs" }
falo-scene = { path = "crates/falo-scene" }
falo-assets = { path = "crates/falo-assets" }
falo-audio = { path = "crates/falo-audio" }
falo-physics = { path = "crates/falo-physics" }
falo-animation = { path = "crates/falo-animation" }
falo-particles = { path = "crates/falo-particles" }
falo-ui = { path = "crates/falo-ui" }
falo-network = { path = "crates/falo-network" }
falo-serialization = { path = "crates/falo-serialization" }
falo-debug = { path = "crates/falo-debug" }
falo-profiler = { path = "crates/falo-profiler" }
falo-scripting = { path = "crates/falo-scripting" }

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 0
